      {
        "@context": "https://schema.org",

        "mainEntity": [
          {"@type": "Question", "name": "Tager I imod nye patienter?", "acceptedAnswer": {"@type": "Answer", "text": "Ja, vi tager løbende imod nye patienter, både hvis du kommer fra den kommunale tandpleje eller skifter fra en anden tandlæge. Du behøver ikke flytte din journal før første besøg. Det ordner vi bagefter."}},
          {"@type": "Question", "name": "Jeg har ikke været hos tandlægen i mange år. Bliver der skældt ud?", "acceptedAnswer": {"@type": "Answer", "text": "Nej. Vi har set det hele før, og første besøg er en samtale, ikke en eksamen. Vi kigger, vi forklarer, og vi lægger en plan i dit tempo."}},
          {"@type": "Question", "name": "Kan jeg blive bedøvet?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. Vi bruger lokalbedøvelse ved de behandlinger, hvor det er relevant. Er du nervøs for et større indgreb, så ring 65 31 33 00 og fortæl os det, så planlægger vi det sammen."}},
          {"@type": "Question", "name": "Hvad koster et eftersyn?", "acceptedAnswer": {"@type": "Answer", "text": "Vores priser følger Tandlægeforeningens overenskomst og sundhed.dk. Et årligt eftersyn for voksne er delvist dækket af den offentlige sygesikring. Ring 65 31 33 00, hvis du vil have en konkret pris, før du kommer."}},
          {"@type": "Question", "name": "Har I ventetid?", "acceptedAnswer": {"@type": "Answer", "text": "Akutte tilfælde prioriteres. Til et almindeligt eftersyn ringer du i telefontiden 08–12 og aftaler en tid, der passer dig."}},
          {"@type": "Question", "name": "Hvad gør jeg ved akut tandpine om aftenen eller i weekenden?", "acceptedAnswer": {"@type": "Answer", "text": "Ring til Tandlægevagten Fyn på 99 44 08 09. I vores åbningstid ringer du til os på 65 31 33 00, og akutte tilfælde prioriteres."}},
          {"@type": "Question", "name": "Hvad er All-on-4?", "acceptedAnswer": {"@type": "Answer", "text": "All-on-4 er en fast bro til en hel kæbe, der sidder på fire implantater. Broen sættes på samme dag, som tænderne trækkes ud, så du får fastsiddende tænder samme dag. Vi var de første i Danmark, der udførte behandlingen."}},
          {"@type": "Question", "name": "Hvad hvis jeg bliver forhindret?", "acceptedAnswer": {"@type": "Answer", "text": "Meld afbud senest kl. 12 dagen før. Udebliver du uden afbud, opkræver vi et gebyr på 250 kr."}}
